name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Lint (non-blocking, known no-explicit-any errors)
        run: npm run lint
        continue-on-error: true

  model-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model-service/requirements.txt
      - name: Install CPU-only PyTorch first (keeps the install small)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Fast tests (fake models, no downloads)
        run: python -m pytest -m "not slow" -q

  automation-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check server.js
